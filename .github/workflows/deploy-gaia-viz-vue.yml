name: Deploy Hazard Risk Dashboard
on:
  push:
    branches: [main]
    paths:
      - 'gaia-viz-vue/**' # Only run when you change the Vue code

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          cd gaia-viz-vue
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gaia-viz-vue/dist
          destination_dir: hazard-risk-dashboard # This creates the /hazard-risk-dashboard/ folder
