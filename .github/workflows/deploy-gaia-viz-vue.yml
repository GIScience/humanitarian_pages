name: Deploy Hazard Risk Dashboard and other static pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # --- DEV BUILD (from HEAD) ---
      - name: Build GAIA Vue (Dev)
        run: |
          cd gaia-viz-vue
          npm install
          npm run build
          cd ..

      - name: Build OQAPI Vue (Dev)
        run: |
          cd oqapi-country-reports-vue
          npm install
          npm run build
          cd ..

      # --- Checkout latest release tag ---
      - name: Checkout latest release tag
        run: |
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
          git checkout $LATEST_TAG

      # --- PROD BUILD (from latest tag) ---
      - name: Build GAIA Vue (Prod)
        run: |
          cd gaia-viz-vue
          npm install
          npm run build
          cd ..

      - name: Build OQAPI Vue (Prod)
        run: |
          cd oqapi-country-reports-vue
          npm install
          npm run build
          cd ..

      # --- Stage everything (prod from tag is the deployed version) ---
      - name: Prep staging folder
        run: |
          mkdir _site

          rsync -av \
            --exclude='gaia-viz-vue' \
            --exclude='oqapi-country-reports-vue' \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            ./ ./_site/

          mkdir -p ./_site/gaia-dashboard
          cp -r ./gaia-viz-vue/dist/* ./_site/gaia-dashboard/

          mkdir -p ./_site/oqapi-country-report
          cp -r ./oqapi-country-reports-vue/dist/* ./_site/oqapi-country-report/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

