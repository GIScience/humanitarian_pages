name: Deploy Hazard Risk Dashboard and other static pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # 1. Build GAIA Project
      - name: Build GAIA Vue
        run: |
          cd gaia-viz-vue
          npm install
          npm run build
          cd ..

      # 2. Build OQAPI Project
      - name: Build OQAPI Vue
        run: |
          cd oqapi-country-reports-vue
          npm install
          npm run build
          cd ..

      # 3. Prepare staging folder
      - name: Prep staging folder
        run: |
          mkdir _site
          
          # Copy root static files, excluding source and hidden folders
          rsync -av \
            --exclude='gaia-viz-vue' \
            --exclude='oqapi-country-reports-vue' \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            ./ ./_site/
          
          # Create GAIA folder (Matches base: /humanitarian_pages/gaia-dashboard/)
          mkdir -p ./_site/gaia-dashboard
          cp -r ./gaia-viz-vue/dist/* ./_site/gaia-dashboard/
          
          # Create OQAPI folder (Matches base: /humanitarian_pages/oqapi-country-report/)
          # Note: We use the EXACT name from your vite.config.ts
          mkdir -p ./_site/oqapi-country-report
          cp -r ./oqapi-country-reports-vue/dist/* ./_site/oqapi-country-report/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site