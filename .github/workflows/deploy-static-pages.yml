name: Deploy OQAPI and other static pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build OQAPI Vue
        run: |
          cd oqapi-country-reports-vue
          npm install
          npm run build
          cd ..

      # --- Stage everything ---
      - name: Prep staging folder
        run: |
          mkdir _site

          rsync -av \
            --exclude='oqapi-country-reports-vue' \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            ./ ./_site/

          # OQAPI
          mkdir -p ./_site/oqapi-country-report
          cp -r ./oqapi-country-reports-vue/dist/* ./_site/oqapi-country-report/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

